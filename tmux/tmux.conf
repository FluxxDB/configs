# --- prefix: Ctrl+b -> Ctrl+a (iTerm2 maps Cmd+a -> 0x01) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- basics ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10

# mouse scroll speed: lines per wheel tick (tmux default is 5)
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# terminfo
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# reload
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- theme ---
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left " #[bold]#S #[default]"
set -g status-left-length 40

set -g status-right "#[fg=#a6adc8]%H:%M  #[fg=#89b4fa]#h "
set -g status-right-length 40

setw -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# prompt colors — deliberately NOT the same blue as the active window
set -g message-style "bg=#f38ba8,fg=#1e1e2e,bold"
set -g message-command-style "bg=#f38ba8,fg=#1e1e2e,bold"
