# --- prefix: Ctrl+b -> Cmd+a (iTerm2 maps Cmd+a to 0x01, i.e. Ctrl+a) ---
# Alt+a also works (left Option sends Esc+), matching the Windows setup.
unbind C-b
set -g prefix C-a
set -g prefix2 M-a
bind C-a send-prefix
bind M-a send-prefix -2

# --- basics ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10

# pass terminal focus in/out to apps (the beacon TUI uses it to tell if you saw new posts)
set -g focus-events on

# mouse scroll speed: lines per wheel tick (tmux default is 5)
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# mouse copy: when scrolled back, copy without leaving copy mode so the view
# doesn't jump to the bottom; at the bottom, copy and exit as usual
bind -T copy-mode    MouseDragEnd1Pane if -F "#{scroll_position}" "send -X copy-pipe" "send -X copy-pipe-and-cancel"
bind -T copy-mode-vi MouseDragEnd1Pane if -F "#{scroll_position}" "send -X copy-pipe" "send -X copy-pipe-and-cancel"
bind -T copy-mode    DoubleClick1Pane  select-pane \; send -X select-word \; run -d 0.3 \; if -F "#{scroll_position}" "send -X copy-pipe" "send -X copy-pipe-and-cancel"
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send -X select-word \; run -d 0.3 \; if -F "#{scroll_position}" "send -X copy-pipe" "send -X copy-pipe-and-cancel"
bind -T copy-mode    TripleClick1Pane  select-pane \; send -X select-line \; run -d 0.3 \; if -F "#{scroll_position}" "send -X copy-pipe" "send -X copy-pipe-and-cancel"
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send -X select-line \; run -d 0.3 \; if -F "#{scroll_position}" "send -X copy-pipe" "send -X copy-pipe-and-cancel"

# terminfo
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# reload
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- theme ---
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left " #[bold]#S #[default]"
set -g status-left-length 40

set -g status-right "#[fg=#a6adc8]%H:%M  #[fg=#89b4fa]#h "
set -g status-right-length 40

setw -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# prompt colors — deliberately NOT the same blue as the active window
set -g message-style "bg=#f38ba8,fg=#1e1e2e,bold"
set -g message-command-style "bg=#f38ba8,fg=#1e1e2e,bold"

# --- plugins: sessions survive a reboot (install.sh clones them) ---
# tmux-resurrect saves and restores sessions, windows, panes and their folders
# (prefix Ctrl-s saves, prefix Ctrl-r restores). tmux-continuum saves every 15
# minutes and restores the last save when tmux starts. Load these last:
# continuum hooks into status-right.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
if "test -d ~/.local/share/tmux/plugins/tmux-resurrect" "run-shell ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux"
if "test -d ~/.local/share/tmux/plugins/tmux-continuum" "run-shell ~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux"
